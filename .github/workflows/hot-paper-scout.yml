name: Hot Paper Scout

on:
  workflow_dispatch:
    inputs:
      profile_tag:
        description: "Comma-separated DPR profile tags"
        required: false
        default: ""
      domain_query:
        description: "Semicolon-separated domain queries"
        required: false
        default: "embodied intelligence; embodied AI; embodied agents; vision-language-action model; robot foundation model; generalist robot policy; humanoid robot policy; robot learning foundation model"
      days_window:
        description: "Recent window in days: 7, 14, or 30"
        required: false
        default: "30"
      institution_filter:
        description: "all / company / university; company means embodied-AI-company-led"
        required: false
        default: "company"
      max_results:
        description: "Maximum papers to keep"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: hot-paper-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
      SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
      SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
      DPR_LLM_REQUEST_TIMEOUT: "25"
      DPR_LLM_REQUEST_ATTEMPTS: "1"
      STEP6_STRUCTURED_MAX_TOKENS: "2048"
      PAPER_MEDIA_WEBP_QUALITY: "94"
      PAPERCROPPER_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6" requests "PyMuPDF>=1.24" Pillow

      - name: Scout hot papers
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          python src/hot_paper_scout.py \
            --profile-tag "${{ github.event.inputs.profile_tag }}" \
            --domain-query "${{ github.event.inputs.domain_query }}" \
            --days-window "${{ github.event.inputs.days_window }}" \
            --institution-filter "${{ github.event.inputs.institution_filter }}" \
            --max-results "${{ github.event.inputs.max_results }}" | tee "$LOG_FILE"
          HOT_RUN_TOKEN="$(grep -oE 'HOT_RUN_TOKEN=[^[:space:]]+' "$LOG_FILE" | tail -n 1 | cut -d= -f2)"
          if [ -z "$HOT_RUN_TOKEN" ]; then
            echo "::error::HOT_RUN_TOKEN not found in scout output"
            exit 1
          fi
          echo "HOT_RUN_TOKEN=$HOT_RUN_TOKEN" >> "$GITHUB_ENV"

      - name: Generate docs from hot recommend
        run: |
          set -euo pipefail
          if [ -z "${HOT_RUN_TOKEN:-}" ]; then
            echo "::error::HOT_RUN_TOKEN is empty"
            exit 1
          fi
          case "${{ github.event.inputs.institution_filter }}" in
            company) FILTER_LABEL="具身智能公司领衔" ;;
            university) FILTER_LABEL="高校" ;;
            *) FILTER_LABEL="全部机构" ;;
          esac
          python src/6.generate_docs.py \
            --date "$HOT_RUN_TOKEN" \
            --mode standard \
            --docs-dir docs \
            --sidebar-date-label "热点论文筛选 · 最近 ${{ github.event.inputs.days_window }} 天 · ${FILTER_LABEL}" \
            --glance-only \
            --force-glance \
            --docs-concurrency 6

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          git add docs archive
          if git diff --cached --quiet; then
            echo "No hot paper changes to commit."
            exit 0
          fi

          git commit -m "[chore] hot paper scout"
          git status --short
          git fetch origin "$branch"
          git rebase -X theirs "origin/$branch"
          git push origin HEAD:"$branch"
